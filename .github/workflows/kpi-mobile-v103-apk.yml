name: Build KPI Mobile V1.0.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - kpi-mobile-v1.0.3-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf /tmp/kpi_src
          mkdir -p /tmp/kpi_src/lib
          cp kpi_mobile_app/pubspec.yaml /tmp/kpi_src/pubspec.yaml
          cp kpi_mobile_app/lib/*.dart /tmp/kpi_src/lib/
          cd kpi_mobile_app
          flutter create --platforms=android,ios --org vn.viettel.caobang --project-name viettel_cao_bang_kpi .
          rm -rf lib test
          cp -R /tmp/kpi_src/lib ./lib
          cp /tmp/kpi_src/pubspec.yaml ./pubspec.yaml

      - name: Enable Android network access and label
        working-directory: kpi_mobile_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              pos=s.find('>')+1
              s=s[:pos]+'\n    <uses-permission android:name="android.permission.INTERNET" />'+s[pos:]
          s=s.replace('android:label="viettel_cao_bang_kpi"','android:label="KPI DNS Cao Bằng"')
          p.write_text(s)
          PY

      - name: Dependencies
        working-directory: kpi_mobile_app
        run: flutter pub get

      - name: Analyze
        working-directory: kpi_mobile_app
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: kpi_mobile_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viettel-CaoBang-KPI-v1.0.5-donut-apk
          path: kpi_mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
