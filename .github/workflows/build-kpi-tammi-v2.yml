name: Build KPI Tammi V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "KPI_Tammi_V2_Android/**"
      - ".github/workflows/build-kpi-tammi-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify runner tools
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          ls -la "$ANDROID_HOME" || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
          gradle --version
          gradle -p KPI_Tammi_V2_Android clean assembleDebug --stacktrace
          test -f KPI_Tammi_V2_Android/app/build/outputs/apk/debug/app-debug.apk
          cp KPI_Tammi_V2_Android/app/build/outputs/apk/debug/app-debug.apk KPI_Tammi_V2_GitHub.apk
          ls -lh KPI_Tammi_V2_GitHub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPI_Tammi_V2_GitHub
          path: KPI_Tammi_V2_GitHub.apk
          if-no-files-found: error
          retention-days: 30
