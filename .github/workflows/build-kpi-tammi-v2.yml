name: Build KPI Tammi V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "KPI_Tammi_V2_Android/**"
      - ".github/workflows/build-kpi-tammi-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail
          java -version

      - name: Install Android command line tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -L --retry 3 --fail             -o /tmp/cmdline-tools.zip             https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/cmdline-tools.zip" | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cli/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 --fail             -o /tmp/gradle.zip             https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
          gradle --version
          gradle -p KPI_Tammi_V2_Android clean assembleDebug --stacktrace
          test -f KPI_Tammi_V2_Android/app/build/outputs/apk/debug/app-debug.apk
          cp KPI_Tammi_V2_Android/app/build/outputs/apk/debug/app-debug.apk KPI_Tammi_V2_GitHub.apk
          ls -lh KPI_Tammi_V2_GitHub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPI_Tammi_V2_GitHub
          path: KPI_Tammi_V2_GitHub.apk
          if-no-files-found: error
          retention-days: 30
