name: Build KPI Tammi V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "KPI_Tammi_V2_Android/**"
      - ".github/workflows/build-kpi-tammi-v2.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p KPI_Tammi_V2_Android assembleDebug --stacktrace

      - name: Rename APK
        run: cp KPI_Tammi_V2_Android/app/build/outputs/apk/debug/app-debug.apk KPI_Tammi_V2_GitHub.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KPI_Tammi_V2_GitHub
          path: KPI_Tammi_V2_GitHub.apk
          if-no-files-found: error
          retention-days: 30
