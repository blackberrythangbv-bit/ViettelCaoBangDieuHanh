name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o ViettelCaoBangDieuHanh_MVP_0.1_buildready.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project
        id: locate
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          find extracted -type f -name "*.apk" -exec cp {} output/ \;
          ls -lah output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-APK
          path: output/*.apk
          if-no-files-found: error
