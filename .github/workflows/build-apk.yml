name: Build Android APK V1.2.5 WEBAPP FULL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/apk-1.2.5-web-link
    paths:
      - '.github/workflows/build-apk.yml'
      - 'mobile-apk-v12/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK V1.2.5
        working-directory: mobile-apk-v12
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp mobile-apk-v12/app/build/outputs/apk/debug/app-debug.apk ViettelCaoBangDieuHanh-V1.2.5-WEBAPP-FULL.apk

      - name: Upload APK V1.2.5
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V1.2.5-WEBAPP-FULL-APK
          path: ViettelCaoBangDieuHanh-V1.2.5-WEBAPP-FULL.apk
          if-no-files-found: error
          retention-days: 30
