name: Build Android APK V11 REALTIME AM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip V11 project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_V11_REALTIME_AM.zip -d extracted
          grep -n "V11 REALTIME" extracted/app/src/main/java/com/viettel/caobang/dieuhanh/MainActivity.kt
          grep -n 'versionCode = 11' extracted/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V11 APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload V11 APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V11-REALTIME-AM-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
