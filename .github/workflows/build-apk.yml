name: Build Android APK V10 REALTIME FULL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip V10 project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_V10_REALTIME_FULL.zip -d extracted
          grep -n "V10 REALTIME DAILY REPORT" extracted/app/src/main/java/com/viettel/caobang/dieuhanh/data/SecureKpiRepository.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V10 APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V10-REALTIME-FULL-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
