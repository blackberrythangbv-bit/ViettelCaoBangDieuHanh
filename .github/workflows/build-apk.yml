name: Build Android APK V14 REALTIME WEEK ACTUAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip V14 project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_V14_REALTIME_WEEKACTUAL.zip -d extracted
          grep -n "V14 REALTIME • TH tuần thực tế" extracted/app/src/main/java/com/viettel/caobang/dieuhanh/MainActivity.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V14 APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload V14 APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V14-REALTIME-WEEKACTUAL-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
