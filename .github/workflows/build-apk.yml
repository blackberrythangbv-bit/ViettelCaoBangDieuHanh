name: Build Android APK V13 REALTIME AM DETAILFIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip V13
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_V13_REALTIME_AM_DETAILFIX.zip -d extracted
          grep -n "V13 REALTIME" extracted/app/src/main/java/com/viettel/caobang/dieuhanh/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V13-REALTIME-AM-DETAILFIX-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
