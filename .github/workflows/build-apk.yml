name: Build Android APK v0.5 REALDATA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip v0.5 project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_v0.5_REALDATA_TRIAL.zip -d extracted
          echo "CHECK VERSION:"
          grep -n "v0.5 dữ liệu thực" extracted/app/src/main/java/com/viettel/caobang/dieuhanh/MainActivity.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v0.5 APK
        working-directory: extracted
        run: |
          gradle :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/

      - name: Upload v0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-v0.5-REALDATA-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
