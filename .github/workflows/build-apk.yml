name: Build Android APK v0.8 REALTIME

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip v0.8 realtime project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_v0.8_REALTIME.zip -d extracted
          grep -n "v0.8 REALTIME" extracted/app/src/main/java/com/viettel/caobang/dieuhanh/data/SecureKpiRepository.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-v0.8-REALTIME-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

