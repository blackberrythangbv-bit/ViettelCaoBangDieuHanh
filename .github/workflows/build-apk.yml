name: Build Android APK V1.2.4 WEBAPP FULL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip stable V14 project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o ViettelCaoBangDieuHanh_V14_REALTIME_WEEKACTUAL.zip -d extracted

      - name: Update APK to latest Web App and version V1.2.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('extracted')
          main = root / 'app/src/main/java/com/viettel/caobang/dieuhanh/MainActivity.kt'
          if not main.exists():
              raise SystemExit(f'Missing {main}')

          new_url = 'https://script.google.com/macros/s/AKfycbzMwfI2QP9ZFCE8owJCGAcqX9jR3yvjwqelMm0fyirWDa7RFX79kIfKeAiMv_NpJRgSrA/exec'
          text = main.read_text(encoding='utf-8')

          # Chỉ thay URL Web App chính trong MainActivity; không đụng các endpoint khác.
          pattern = r'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec'
          urls = re.findall(pattern, text)
          if not urls:
              raise SystemExit('Không tìm thấy URL Google Apps Script trong MainActivity.kt')
          text2, n = re.subn(pattern, new_url, text, count=1)
          main.write_text(text2, encoding='utf-8')
          print('Updated Web App URL:', urls[0], '->', new_url)
          print('URL replacements:', n)

          # Tăng versionName lên 1.2.4; versionCode tăng 1 nếu tìm thấy.
          gradle_files = [
              root / 'app/build.gradle',
              root / 'app/build.gradle.kts',
          ]
          found_gradle = False
          for gp in gradle_files:
              if not gp.exists():
                  continue
              found_gradle = True
              g = gp.read_text(encoding='utf-8')
              g2 = re.sub(r'versionName\s*(?:=\s*)?["\'][^"\']+["\']',
                          lambda m: 'versionName = "1.2.4"' if '=' in m.group(0) else 'versionName "1.2.4"',
                          g, count=1)
              def bump(m):
                  prefix, num = m.group(1), int(m.group(2))
                  return f'{prefix}{num + 1}'
              g2 = re.sub(r'(versionCode\s*(?:=\s*)?)(\d+)', bump, g2, count=1)
              gp.write_text(g2, encoding='utf-8')
              print('Updated version in', gp)
          if not found_gradle:
              raise SystemExit('Không tìm thấy app/build.gradle hoặc app/build.gradle.kts')
          PY

          echo "=== VERIFY WEB APP URL ==="
          grep -n "AKfycbzMwfI2QP9ZFCE8owJCGAcqX9jR3yvjwqelMm0fyirWDa7RFX79kIfKeAiMv_NpJRgSrA" \
            extracted/app/src/main/java/com/viettel/caobang/dieuhanh/MainActivity.kt
          echo "=== VERIFY VERSION ==="
          grep -R -n -E "version(Name|Code)" extracted/app/build.gradle* || true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK V1.2.4
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK V1.2.4
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V1.2.4-WEBAPP-FULL-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
