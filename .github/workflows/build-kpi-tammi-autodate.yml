name: Build KPI Tammi AutoDate V1.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kpi-tammi-autodate/**'
      - '.github/workflows/build-kpi-tammi-autodate.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK and install Android 35
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: kpi-tammi-autodate
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          test -s kpi-tammi-autodate/app/build/outputs/apk/debug/app-debug.apk
          cp kpi-tammi-autodate/app/build/outputs/apk/debug/app-debug.apk KPI_Tammi_AutoDate_V1.3.0.apk
          ls -lh KPI_Tammi_AutoDate_V1.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KPI_Tammi_AutoDate_V1.3.0
          path: KPI_Tammi_AutoDate_V1.3.0.apk
          if-no-files-found: error
          retention-days: 30
