name: Build Mobile V1.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile-apk-v11/**'
      - '.github/workflows/build-mobile-v11-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-apk-v11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile-apk-v11/package.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ViettelCaoBangDieuHanh-V1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V1.1-APK
          path: mobile-apk-v11/ViettelCaoBangDieuHanh-V1.1.apk
          if-no-files-found: error
