name: Build APK V1.2.4 AUTO REPORT 0730

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/auto-report-0730-v124 ]
    paths:
      - 'mobile-apk-v12/**'
      - '.github/workflows/build-mobile-v12-apk.yml'

# Final rebuild after exact-alarm permission handling was added.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mobile-apk-v12
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp mobile-apk-v12/app/build/outputs/apk/debug/app-debug.apk ViettelCaoBangDieuHanh-V1.2.4-AUTO-REPORT-0730.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelCaoBangDieuHanh-V1.2.4-AUTO-REPORT-0730-APK
          path: ViettelCaoBangDieuHanh-V1.2.4-AUTO-REPORT-0730.apk
          if-no-files-found: error
