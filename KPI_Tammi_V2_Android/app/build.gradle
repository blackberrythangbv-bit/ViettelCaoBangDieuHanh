plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.viettel.caobang.kpitammi.v2'
    compileSdk 35

    defaultConfig {
        applicationId "vn.viettel.caobang.kpitammi.v2"
        minSdk 26
        targetSdk 35
        versionCode 204
        versionName "2.0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

