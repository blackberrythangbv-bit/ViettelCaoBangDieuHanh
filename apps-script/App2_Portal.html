<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e80500">
<title>Điều hành Viettel Cao Bằng</title>
<style>
:root{--r:#e80500;--r2:#c90400;--d:#40474b;--bg:#f3f5f6;--line:#e4e7e9;--txt:#30363a;--muted:#747b80}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--txt)}body{overflow:hidden}.top{height:60px;background:linear-gradient(90deg,var(--r),var(--r2));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;box-shadow:0 2px 8px #0002;position:relative;z-index:20}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{font-weight:900;border:1px solid #fff;border-radius:7px;padding:5px 9px;white-space:nowrap}.title{min-width:0}.title b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;font-size:11px;opacity:.9;margin-top:2px}.actions{display:flex;gap:6px}.iconbtn{border:1px solid #ffffff66;color:#fff;background:#ffffff12;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer;white-space:nowrap}.iconbtn.back{background:#fff;color:var(--r);border-color:#fff}.tabs{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:7px 10px;overflow-x:auto;box-shadow:0 1px 4px #0001;position:relative;z-index:19}.tab{border:1px solid var(--line);background:#f7f8f8;color:var(--d);border-radius:8px;padding:9px 11px;font-weight:800;cursor:pointer;white-space:nowrap;min-width:max-content}.tab.active{background:var(--r);border-color:var(--r);color:#fff;box-shadow:0 2px 7px #e8050030}.tab:active{transform:scale(.98)}.stage{height:calc(100vh - 116px);position:relative;background:var(--bg)}.panel{position:absolute;inset:0;visibility:hidden;pointer-events:none;contain:layout paint style}.panel.active{visibility:visible;pointer-events:auto}.frame{width:100%;height:100%;border:0;background:#fff;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2;pointer-events:none}.loading.hide{display:none}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 22px;box-shadow:0 3px 12px #0001;font-weight:800;color:var(--d)}@media(max-width:760px){.top{height:56px;padding:0 8px}.logo{font-size:11px;padding:4px 6px}.title b{font-size:14px}.title span{display:none}.actions .homeText{display:none}.tabs{height:52px;padding:5px 6px}.tab{font-size:11.5px;padding:8px 9px}.stage{height:calc(100vh - 108px)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">VIETTEL CAO BẰNG</div><div class="title"><b>ĐIỀU HÀNH KINH DOANH</b><span>Một nền tảng · KPI mặc định · Trường học/DN nạp theo yêu cầu</span></div></div><div class="actions"><button class="iconbtn back" id="backTab">← <span class="homeText">QUAY LẠI</span></button><button class="iconbtn" id="home">⌂ <span class="homeText">KPI</span></button><button class="iconbtn" id="reload">↻</button></div></header>
<nav class="tabs" aria-label="Chức năng điều hành"><button class="tab active" data-view="kpi">📊 KPI</button><button class="tab" data-view="report">📋 BÁO CÁO NGÀY</button><button class="tab" data-view="plan">📅 KH TUẦN</button><button class="tab" data-view="school">🏫 TRƯỜNG HỌC</button><button class="tab" data-view="enterprise">🏢 DOANH NGHIỆP</button></nav>
<main class="stage">
<section class="panel active" id="p-kpi"><div class="loading"><div class="box">Đang nạp KPI...</div></div><iframe class="frame" title="KPI" data-src="<?= appUrl ?>?view=kpi" loading="eager"></iframe></section>
<section class="panel" id="p-report"><div class="loading"><div class="box">Đang nạp Báo cáo ngày...</div></div><iframe class="frame" title="Báo cáo ngày" data-src="<?= appUrl ?>?view=report" loading="lazy"></iframe></section>
<section class="panel" id="p-plan"><div class="loading"><div class="box">Đang nạp Kế hoạch tuần...</div></div><iframe class="frame" title="Kế hoạch tuần" data-src="<?= appUrl ?>?view=plan" loading="lazy"></iframe></section>
<section class="panel" id="p-school"><div class="loading"><div class="box">Đang nạp Trường học...</div></div><iframe class="frame" title="Trường học" data-src="<?= appUrl ?>?view=school" loading="lazy"></iframe></section>
<section class="panel" id="p-enterprise"><div class="loading"><div class="box">Đang nạp Doanh nghiệp...</div></div><iframe class="frame" title="Doanh nghiệp" data-src="<?= appUrl ?>?view=enterprise" loading="lazy"></iframe></section>
</main>
<script>
const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];let active='kpi',tabHistory=[];
function frameOf(v){return document.querySelector('#p-'+v+' iframe')}
function ensure(v,force=false){const f=frameOf(v);if(!f)return;const p=f.closest('.panel'),base=f.dataset.src;if(force){p.querySelector('.loading')?.classList.remove('hide');f.src=base+(base.includes('?')?'&':'?')+'_reload='+Date.now();f.dataset.started='1';return}if(!f.dataset.started){f.dataset.started='1';f.src=base}}
function activate(v,remember=true){if(!document.getElementById('p-'+v))return;if(v===active){ensure(v,false);return}if(remember)tabHistory.push(active);active=v;tabs.forEach(t=>t.classList.toggle('active',t.dataset.view===v));panels.forEach(p=>p.classList.toggle('active',p.id==='p-'+v));ensure(v,false)}
tabs.forEach(t=>t.addEventListener('click',()=>activate(t.dataset.view,true),{passive:true}));document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>f.closest('.panel').querySelector('.loading')?.classList.add('hide'),{passive:true}));
document.getElementById('backTab').onclick=()=>{const prev=tabHistory.pop();if(prev)activate(prev,false);else if(active!=='kpi')activate('kpi',false);else if(history.length>1)history.back()};
document.getElementById('home').onclick=()=>{tabHistory=[];activate('kpi',false)};document.getElementById('reload').onclick=()=>ensure(active,true);window.addEventListener('message',e=>{if(e.data&&e.data.type==='APP2_NAV')activate(e.data.view||'kpi',true)});ensure('kpi',false);
</script>
</body>
</html>
