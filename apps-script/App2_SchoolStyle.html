<style>
:root{--r:#e80500;--d:#42494d;--g:#1ba94c;--o:#ff8a00;--b:#f4f5f6;--bl:#0077c8}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--d);font:14px Calibri,Arial,sans-serif}

.search{position:relative}.drop{display:none;position:absolute;z-index:20;top:100%;left:0;width:min(540px,90vw);background:#fff;border:1px solid #ddd;border-radius:9px;padding:8px;box-shadow:0 8px 20px #0002}.drop.on{display:block}.opts{max-height:300px;overflow:auto}.opt{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #eee;padding:8px;cursor:pointer}.opt:hover{background:#fff6f5}.opt small{display:block;color:#7a8186;margin-top:2px}
