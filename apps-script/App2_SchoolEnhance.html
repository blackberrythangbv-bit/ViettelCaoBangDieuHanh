<script>
(() => {
  if (window.__schoolEnhanceV2) return;
  window.__schoolEnhanceV2 = true;
  function ready(fn, tries = 80) { try { if (typeof D !== 'undefined' && typeof render === 'function' && typeof st === 'function' && typeof am === 'function') return fn(); } catch (_) {} if (tries > 0) setTimeout(() => ready(fn, tries - 1), 100); }
  ready(() => {
    const RED='#e80500', GREEN='#1ba94c', ORANGE='#ff8a00', DARK='#42494d';
    const css=document.createElement('style');css.textContent=`.school-v2-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.school-v2-tab{border:1px solid #e0e4e6;background:#fff;color:${DARK};border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer}.school-v2-tab.active{background:${RED};border-color:${RED};color:#fff}.province-v2{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:9px;margin:0 0 12px}.province-v2 .pv{border:1px solid #e4e7e9;border-radius:9px;padding:9px 10px;background:#fafbfb}.province-v2 .pv b{display:block;font-size:21px;color:${DARK}}.province-v2 .pv span{font-size:10.5px;color:#747b80;font-weight:700}.progress-tools-v2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.progress-tools-v2 .note{font-size:11px;color:#747b80;margin-left:auto}#amListCard.v2-focus h3{font-size:16px;text-transform:uppercase}@media(max-width:1000px){.province-v2{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.province-v2{grid-template-columns:repeat(2,1fr)}.progress-tools-v2 .note{width:100%;margin-left:0}}`;document.head.appendChild(css);
    const wrap=document.querySelector('.wrap'),kpi=document.getElementById('kpiRow')||document.getElementById('kpis'),grid2=document.querySelector('.grid2'),alertBox=document.getElementById('alertBox')||document.querySelector('.alert'),amCard=document.getElementById('amListCard')||document.getElementById('amgrid')?.closest('.card');if(!wrap||!amCard)return;
    amCard.id='amListCard';amCard.classList.add('v2-focus');const h=amCard.querySelector('h3');if(h)h.innerHTML='<span class="dot"></span>TIẾN ĐỘ THEO AM ĐƯỢC GIAO TIẾP XÚC';
    const nav=document.createElement('div');nav.className='school-v2-tabs';nav.innerHTML='<button class="school-v2-tab active" data-v2="overview">TỔNG QUAN TOÀN TỈNH</button><button class="school-v2-tab" data-v2="progress">TIẾN ĐỘ THEO AM ĐƯỢC GIAO TIẾP XÚC</button>';wrap.insertBefore(nav,wrap.firstChild);
    const tools=document.createElement('div');tools.className='progress-tools-v2';const province=document.createElement('div');province.className='province-v2';province.id='provinceSummaryV2';const grid=document.getElementById('amGrid')||document.getElementById('amgrid');if(grid)amCard.insertBefore(province,grid);
    const exportBtn=document.getElementById('exportExcel');if(exportBtn){exportBtn.textContent='XUẤT EXCEL BÁO CÁO TỔNG HỢP';exportBtn.style.background='#1B6E3B';exportBtn.style.color='#fff';tools.appendChild(exportBtn)}
    const refresh=document.createElement('button');refresh.type='button';refresh.className='reset-btn';refresh.textContent='LẤY DỮ LIỆU MỚI';refresh.onclick=async()=>{refresh.disabled=true;const old=refresh.textContent;refresh.textContent='ĐANG ĐỒNG BỘ...';try{if(typeof loadSharedData==='function')await loadSharedData();else if(typeof load==='function')await load();renderProvince()}finally{refresh.disabled=false;refresh.textContent=old}};tools.appendChild(refresh);
    const note=document.createElement('span');note.className='note';note.textContent='Excel luôn lấy lại dữ liệu mới nhất trước khi xuất';tools.appendChild(note);amCard.insertBefore(tools,province);
    function stats(){const rows=Array.isArray(D)?D:[],assignedRows=rows.filter(r=>String(r.am||r.giaoam||'').trim()),total=rows.length,assigned=assignedRows.length,done=assignedRows.filter(r=>st(r)==='done').length,pending=Math.max(assigned-done,0),p1=assignedRows.filter(r=>String(r.uutien||'').includes('1')),p1done=p1.filter(r=>st(r)==='done').length,risk=assignedRows.filter(r=>/từ chối|đối thủ/i.test(String(r.ketqua||''))).length,consider=assignedRows.filter(r=>/cân nhắc/i.test(String(r.ketqua||''))).length;return{total,assigned,done,pending,pct:assigned?Math.round(done*100/assigned):0,p1:p1.length,p1done,risk,consider}}
    function renderProvince(){const s=stats();province.innerHTML=[[s.assigned,'Trường đã giao AM'],[s.done,'Đã tiếp xúc'],[s.pending,'Chưa tiếp xúc'],[s.pct+'%','% hoàn thành'],[s.p1done+'/'+s.p1,'Ưu tiên 1 đã TX'],[s.risk,'Từ chối / đối thủ'],[s.consider,'Cần tái tiếp xúc']].map(x=>`<div class="pv"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
    function setView(view){const overview=view==='overview';[kpi,grid2,alertBox].forEach(el=>{if(el)el.style.display=overview?'':'none'});amCard.style.display=overview?'none':'';nav.querySelectorAll('.school-v2-tab').forEach(b=>b.classList.toggle('active',b.dataset.v2===view));try{sessionStorage.setItem('school-v2-tab',view)}catch(_){}if(!overview)renderProvince()}
    nav.addEventListener('click',e=>{const b=e.target.closest('[data-v2]');if(b)setView(b.dataset.v2)});const baseRender=render;render=function(){const out=baseRender.apply(this,arguments);renderProvince();return out};renderProvince();let initial='overview';try{initial=sessionStorage.getItem('school-v2-tab')||'overview'}catch(_){}setView(initial==='progress'?'progress':'overview');
  });
})();
</script>
