<script>
const APP=window.APP2_URL,A='https://script.google.com/macros/s/AKfycbzp6C84E5g8PZRtVRzE7PW0a8SwNcZc_fHOKDfa05s2jZJN3iDx7pC7keeiAvxr2xA-/exec',g=x=>document.getElementById(x),n=x=>String(x||'').trim(),l=x=>n(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),e=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D=[],S=null,V=0;
g('back').onclick=()=>location.href=APP+'?view=app2';
function jp(p){return new Promise((ok,no)=>{let c='c'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{q();no(Error('Hết thời gian chờ'))},15000);function q(){clearTimeout(t);try{delete window[c]}catch(_){}s.remove()}window[c]=x=>{q();x&&x.ok?ok(x):no(Error(x?.error||'Lỗi Google Sheet'))};s.onerror=()=>{q();no(Error('Không kết nối Apps Script'))};s.src=A+'?'+new URLSearchParams({...p,callback:c,t:Date.now()});document.head.appendChild(s)})}
const st=r=>n(r.ngay)?'done':'pending',am=r=>n(r.am)||n(r.giaoam)||'Chưa giao AM',idate=v=>{let m=n(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''},odate=v=>{let m=n(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:''};
async function load(){try{let h=await jp({action:'health'});V=+h.version||0;let x=await jp({action:'list'});D=(x.data||[]).filter(r=>/^\d+$/.test(n(r.stt)));let a=[...new Set(D.flatMap(r=>[r.giaoam,r.am]).map(n).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'vi'));g('am').innerHTML='<option value="">Chọn AM phụ trách</option>'+a.map(x=>`<option>${e(x)}</option>`).join('');render();g('load').hidden=true;g('app').hidden=false;if(V<2){g('notice').style.display='block';g('notice').textContent='Apps Script chưa phải V2 nên chưa thể lưu đủ dữ liệu.';g('save').disabled=true}}catch(x){g('load').textContent='Lỗi tải dữ liệu: '+x.message}}
function render(){let t=D.length,d=D.filter(x=>st(x)=='done').length,p1=D.filter(x=>n(x.uutien).includes('1')),p1d=p1.filter(x=>st(x)=='done').length,war=D.filter(x=>/từ chối|đối thủ/i.test(n(x.ketqua))).length,ac=new Set(D.map(am).filter(x=>x!='Chưa giao AM')).size;g('kpis').innerHTML=[[t,'Tổng số trường','150 nhóm / 221 đầu mối giảm'],[ac,'Số AM phụ trách','AM thực tế/GIAO AM'],[d,'Đã tiếp xúc',Math.round(d*100/t)+'% toàn tỉnh'],[t-d,'Chưa tiếp xúc','Cần triển khai'],[p1d+'/'+p1.length,'Ưu tiên 1 đã TX',Math.round(p1d*100/p1.length)+'% nhóm khẩn'],[war,'Cảnh báo','Từ chối/đối thủ']].map(x=>`<div class=k><div class=n>${x[0]}</div><div class=l>${x[1]}</div><div class=sm>${x[2]}</div></div>`).join('');let pc=Math.round(d*100/t);g('donut').style.setProperty('--p',pc);g('donut').dataset.pct=pc+'%';g('pieT').innerHTML=`<tr><th>Trạng thái</th><th>Số trường</th><th>Tỷ lệ</th></tr><tr><td>Đã tiếp xúc</td><td>${d}</td><td>${pc}%</td></tr><tr><td>Chưa tiếp xúc</td><td>${t-d}</td><td>${100-pc}%</td></tr>`;g('quick').innerHTML=`Hoàn thành: <b>${d}/${t}</b><br><br>Còn lại: <b>${t-d}</b><br><br>Ưu tiên 1: <b>${p1d}/${p1.length}</b><br><br>Cảnh báo: <b>${war}</b>`;let m={};D.forEach(r=>{let a=am(r);m[a]??={t:0,d:0,p:0};m[a].t++;if(st(r)=='done')m[a].d++;if(n(r.uutien).includes('1'))m[a].p++});g('amgrid').innerHTML=Object.entries(m).sort().map(([a,v])=>{let q=Math.round(v.d*100/v.t);return `<div class=am><div class=ah><span>${e(a)}</span><small>${v.t} trường</small></div><div class=bar><i style="width:${q}%"></i></div><div class=tags><span class=d>Đã TX ${v.d}</span><span class=p>Còn ${v.t-v.d}</span><span>ƯT1 ${v.p}</span><span>${q}%</span></div></div>`}).join('');let al=[],u=p1.filter(x=>st(x)!='done'),o=D.filter(x=>/đối thủ/i.test(n(x.ketqua))),c=D.filter(x=>/cân nhắc/i.test(n(x.ketqua)));if(u.length)al.push(['KHẨN',u.length+' trường Ưu tiên 1 chưa tiếp xúc']);if(o.length)al.push(['CHÚ Ý',o.length+' trường đang dùng đối thủ']);if(c.length)al.push(['THEO DÕI',c.length+' trường cần thời gian cân nhắc']);g('alerts').innerHTML=al.map(x=>`<div class=ai><b>${x[0]}</b>${x[1]}</div>`).join('')||'Không phát sinh vấn đề nổi bật.';table()}
function filtered(){if(S)return D.filter(x=>x.stt==S.stt);let a=n(g('am').value),z=n(g('status').value),k=l(g('ketqua').value);return D.filter(r=>(!a||am(r)==a)&&(!z||st(r)==z)&&(!k||l(r.ketqua).includes(k)))}
function table(){let R=filtered();g('count').textContent=R.length+' trường';g('tbody').innerHTML=R.map(r=>`<tr><td>${e(r.stt)}</td><td>${e(r.xa)}</td><td>${e(r.cap)}</td><td><button class=pick data-id="${e(r.stt)}">${e(r.truong)}</button></td><td>${e(r.uutien)}</td><td>${e(r.giaoam)}</td><td>${e(r.am)}</td><td>${e(r.ngay)}</td><td>${e(r.nguoi)}<div class=sm>${e(r.chucvu)}</div></td><td>${e(r.sdt)}</td><td>${e(r.dasudung)}<div class=sm>${e(r.dichvu)}</div></td><td>${e(r.ncc)}</td><td><span class="st ${st(r)}">${e(r.ketqua)}</span></td><td>${e(r.ghichu)}</td></tr>`).join('')}
function opts(q=''){q=l(q);g('opts').innerHTML=D.filter(r=>!q||l(r.xa+' '+r.truong).includes(q)).map(r=>`<button class=opt data-id="${e(r.stt)}"><b>${e(r.truong)}</b><small>${e(r.xa)} · ${e(r.cap)} · ${e(r.uutien)} · Giao AM: ${e(r.giaoam)}</small></button>`).join('');g('drop').classList.add('on')}
g('school').onclick=()=>{g('lookup').value='';opts();setTimeout(()=>g('lookup').focus(),0)};g('lookup').oninput=x=>opts(x.target.value);document.onclick=x=>{if(!x.target.closest('.search'))g('drop').classList.remove('on')};
function pick(r){S=r;g('school').value=r.xa+' — '+r.truong;g('prio').value=r.uutien||'';g('am').value='';g('status').value='';g('ketqua').value=r.ketqua||'';g('ngay').value=idate(r.ngay);for(let k of ['nguoi','chucvu','sdt','dichvu','ncc','nhucau','giaiphap','ghichu'])g(k).value=r[k]||'';g('dv').value=r.dasudung||'';g('drop').classList.remove('on');clear();table()}
document.addEventListener('click',x=>{let b=x.target.closest('[data-id]');if(b){let r=D.find(y=>String(y.stt)==b.dataset.id);if(r)pick(r)}});
function clear(){document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));g('msg').textContent='';g('msg').className='msg'}
function draft(){return{am:n(g('am').value),ketqua:n(g('ketqua').value),ngay:odate(g('ngay').value),nguoi:n(g('nguoi').value),chucvu:n(g('chucvu').value),sdt:n(g('sdt').value),dasudung:n(g('dv').value),dichvu:n(g('dichvu').value),ncc:n(g('ncc').value),nhucau:n(g('nhucau').value),giaiphap:n(g('giaiphap').value),ghichu:n(g('ghichu').value)}}
function valid(d){let x=[['school',S,'Tên xã/trường'],['prio',g('prio').value,'Mức ưu tiên'],['am',d.am,'AM phụ trách'],['ketqua',d.ketqua,'Kết quả'],['ngay',d.ngay,'Ngày tiếp xúc'],['nguoi',d.nguoi,'Người đại diện'],['chucvu',d.chucvu,'Chức vụ'],['sdt',d.sdt,'SĐT'],['dv',d.dasudung,'Dùng DV Viettel'],['dichvu',d.dichvu,'Dịch vụ Viettel'],['ncc',d.ncc,'Đối thủ'],['nhucau',d.nhucau,'Nhu cầu/Vấn đề'],['giaiphap',d.giaiphap,'Giải pháp']],m=x.filter(y=>!y[1]);m.forEach(y=>g(y[0]).classList.add('bad'));return m.map(y=>y[2])}
function post(p){return new Promise((ok,no)=>{let i=document.createElement('iframe'),f=document.createElement('form'),nm='f'+Date.now();i.name=nm;i.hidden=true;f.hidden=true;f.method='POST';f.target=nm;f.action=A;for(let[k,v]of Object.entries(p)){let x=document.createElement('input');x.name=k;x.value=v??'';f.appendChild(x)}document.body.append(i,f);try{f.submit()}catch(x){no(x);return}setTimeout(()=>{i.remove();f.remove();ok()},1400)})}
async function confirm(d){for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,650));try{let x=(await jp({action:'get',xa:S.xa,truong:S.truong})).record,q=(a,b)=>n(a)==n(b);if(x&&['am','ketqua','ngay','nguoi','chucvu','sdt','dasudung','dichvu','ncc','nhucau','giaiphap','ghichu'].every(k=>q(x[k],d[k])))return x}catch(_){}}throw Error('Chưa xác nhận dữ liệu đã lưu')}
g('save').onclick=async()=>{clear();let d=draft(),m=valid(d);if(m.length){g('msg').textContent='Thiếu: '+m.join(', ');g('msg').className='msg err';alert('Chưa thể lưu. Thiếu:\n- '+m.join('\n- ')+'\n\nGhi chú được phép để trống.');return}g('save').disabled=true;g('save').textContent='ĐANG LƯU...';try{await post({action:'save',xa:S.xa,truong:S.truong,...d});Object.assign(S,await confirm(d));g('msg').textContent='ĐÃ LƯU THÀNH CÔNG';g('msg').className='msg ok';await load()}catch(x){g('msg').textContent='LƯU THẤT BẠI: '+x.message;g('msg').className='msg err'}finally{g('save').disabled=V<2;g('save').textContent='LƯU'}};
['am','status','ketqua'].forEach(x=>g(x).onchange=()=>{if(!S)table()});g('reset').onclick=()=>{S=null;for(let x of ['school','prio','am','status','ketqua','ngay','nguoi','chucvu','sdt','dv','dichvu','ncc','nhucau','giaiphap','ghichu'])g(x).value='';clear();table()};load();
</script>
