<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e80500">
<title>Điều hành Viettel Cao Bằng</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root{--r:#e80500;--r2:#c90400;--d:#40474b;--bg:#f3f5f6;--line:#e4e7e9;--muted:#747b80}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--d)}body{overflow:hidden}.top{height:62px;background:linear-gradient(90deg,var(--r),var(--r2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 8px #0002;position:relative;z-index:20}.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{font-weight:900;border:1px solid #fff;border-radius:7px;padding:5px 9px;white-space:nowrap}.title{min-width:0}.title b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;font-size:11px;opacity:.9;margin-top:2px}.reload{border:1px solid #ffffff66;color:#fff;background:#ffffff12;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}.tabs{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:7px 10px;position:relative;z-index:15;box-shadow:0 1px 4px #0001;overflow-x:auto}.tab{border:1px solid var(--line);background:#f7f8f8;color:var(--d);border-radius:8px;padding:9px 11px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:var(--r);border-color:var(--r);color:#fff}.status{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}.stage{height:calc(100vh - 118px);position:relative}.panel{position:absolute;inset:0;display:none}.panel.active{display:block}.frame{width:100%;height:100%;border:0;background:#fff;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f3f5f6;z-index:2;pointer-events:none;transition:.18s}.loading.hide{opacity:0;visibility:hidden}.loadbox{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 22px;box-shadow:0 3px 12px #0001;font-weight:800}.fallback{position:absolute;right:10px;bottom:10px;z-index:4;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;box-shadow:0 2px 10px #0002;font-size:11px}.fallback a{color:var(--r);font-weight:800;text-decoration:none}@media(max-width:760px){.top{height:58px;padding:0 9px}.logo{font-size:11px;padding:4px 6px}.title b{font-size:14px}.title span,.reload,.status{display:none}.tabs{height:54px;padding:6px}.tab{font-size:11.5px;padding:9px}.stage{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">VIETTEL CAO BẰNG</div><div class="title"><b>ĐIỀU HÀNH KHDN</b><span>Một cửa vào · 5 module · Chỉ tải khi sử dụng</span></div></div><button id="reload" class="reload">↻ TẢI LẠI</button></header>
<nav class="tabs">
<button class="tab active" data-panel="school">🏫 TRƯỜNG HỌC</button>
<button class="tab" data-panel="enterprise">🏢 TIẾP XÚC DN</button>
<button class="tab" data-panel="kpi">📊 KPI</button>
<button class="tab" data-panel="report">📋 BÁO CÁO NGÀY</button>
<button class="tab" data-panel="plan">📅 KH TUẦN</button>
<div id="status" class="status">Đang mở: Trường học</div>
</nav>
<main class="stage">
<section class="panel active" id="school"><div class="loading"><div class="loadbox">Đang nạp Trường học...</div></div><iframe class="frame" title="Tiếp xúc trường học" src="./" loading="eager"></iframe></section>
<section class="panel" id="enterprise"><div class="loading"><div class="loadbox">Đang nạp Tiếp xúc DN...</div></div><iframe class="frame" title="Tiếp xúc DN" data-src="https://script.google.com/macros/s/AKfycbzxSHqdzpKUSpcf2IhO_0oozRxDx_zZVtLCi7bMzQJiAIOnux7JQFI2JvP188g4RzmD/exec" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="fallback"><a href="https://script.google.com/macros/s/AKfycbzxSHqdzpKUSpcf2IhO_0oozRxDx_zZVtLCi7bMzQJiAIOnux7JQFI2JvP188g4RzmD/exec" target="_blank" rel="noopener">Mở trực tiếp</a></div></section>
<section class="panel" id="kpi"><div class="loading"><div class="loadbox">Đang nạp KPI...</div></div><iframe class="frame" title="KPI" data-src="https://script.google.com/macros/s/AKfycbxm1qZ1c54lRmxFRALgAhsHYsD2AEi1UBivOaVNLHmKofyoLFBGckmtnlCVE-L_BLDalQ/exec?view=kpi" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>
<section class="panel" id="report"><div class="loading"><div class="loadbox">Đang nạp Báo cáo KPI ngày...</div></div><iframe class="frame" title="Báo cáo KPI ngày" data-src="https://script.google.com/macros/s/AKfycbxm1qZ1c54lRmxFRALgAhsHYsD2AEi1UBivOaVNLHmKofyoLFBGckmtnlCVE-L_BLDalQ/exec?view=report" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>
<section class="panel" id="plan"><div class="loading"><div class="loadbox">Đang nạp Kế hoạch tuần...</div></div><iframe class="frame" title="Kế hoạch tuần" data-src="https://script.google.com/macros/s/AKfycbxm1qZ1c54lRmxFRALgAhsHYsD2AEi1UBivOaVNLHmKofyoLFBGckmtnlCVE-L_BLDalQ/exec?view=plan" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>
</main>
<script>
const names={school:'Trường học',enterprise:'Tiếp xúc DN',kpi:'KPI',report:'Báo cáo KPI ngày',plan:'Kế hoạch tuần'};const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];let warmTimer=0;
function forceUrl(base){return base+(base.includes('?')?'&':'?')+'_portalts='+Date.now()}
function loadPanel(id,force=false){const p=document.getElementById(id),f=p?.querySelector('iframe');if(!f)return;if(id==='school'){if(force){p.querySelector('.loading')?.classList.remove('hide');f.src=forceUrl('./')}return}if(force||!f.dataset.started){f.dataset.started='1';p.querySelector('.loading')?.classList.remove('hide');f.src=force?forceUrl(f.dataset.src):f.dataset.src}}
function enhanceSchool(f){try{const d=f.contentDocument;if(!d||d.documentElement.dataset.schoolEnhanceV2==='1')return;d.documentElement.dataset.schoolEnhanceV2='1';const s=d.createElement('script');s.src='./school-enhance-v2.js?v=2';s.async=true;d.body.appendChild(s)}catch(e){console.warn('Không nạp được phần mở rộng Trường học',e)}}
function activate(id){if(!names[id])return;tabs.forEach(t=>t.classList.toggle('active',t.dataset.panel===id));panels.forEach(p=>p.classList.toggle('active',p.id===id));document.getElementById('status').textContent='Đang mở: '+names[id];loadPanel(id,false);try{sessionStorage.setItem('vtcb-portal-tab-v2',id)}catch(_){}}
function warm(id){if(id==='school')return;clearTimeout(warmTimer);warmTimer=setTimeout(()=>loadPanel(id,false),260)}
tabs.forEach(t=>{t.addEventListener('click',()=>activate(t.dataset.panel));t.addEventListener('pointerenter',()=>warm(t.dataset.panel));t.addEventListener('pointerleave',()=>clearTimeout(warmTimer));t.addEventListener('touchstart',()=>loadPanel(t.dataset.panel,false),{passive:true})});
document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{f.closest('.panel')?.querySelector('.loading')?.classList.add('hide');if(f.closest('.panel')?.id==='school')enhanceSchool(f)}));
document.getElementById('reload').onclick=()=>{const p=document.querySelector('.panel.active');if(p)loadPanel(p.id,true)};
try{const saved=sessionStorage.getItem('vtcb-portal-tab-v2');if(saved&&names[saved])activate(saved)}catch(_){ }
</script>
</body>
</html>
