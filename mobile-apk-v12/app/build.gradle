plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viettel.caobang.dieuhanh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.viettel.caobang.dieuhanh'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.2.2'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
